<!-- 課題1-4: プロジェクト課題の検索結果を表示する HTML をここに記述してください．-->
<!DOCTYPE html>
<html>
 <head>
  <meta charset="utf-8">
  <title>Project</title>
  <link rem="stylesheet" href="project-stylesheet.css">
  <script src="tv-program.js" defer></script>
 </head>

 <body>
      
  <h1>NHKの番組表 の検索結果</h1>
  
  
  <select name="channel" id="channel">
    <option value="">検索したいチャンネルを選んでください</option>
    <option value="NHK">NHK総合</option>
    <option value="E1">Eテレ</option>
    <option value="c">ー</option>
  </select>

  <br />

  <select name="genre" id="genre">
    <option value="">検索したいジャンルを選んでください</option>
    <option value="0205">情報・ワイドショー</option>
    <option value="Ani">アニメ</option>
    <option value="Spo">スポーツ</option>
    <option value="Bar">バラエティ</option>
  </select>


  <button id ="Bt">検索</button>


  <table>
   
   <caption></caption>   
   
   <thead id="headder"> 
    <tr> 
     <th scope="col">件数</th>   
     <th scope="col">開始時刻</th>
     <th scope="col">終了時刻</th>
     <th scope="col">チャンネル</th>
     <th scope="col">タイトル</th>
     <th scope="col">サブタイトル</th>
     <th scope="col">番組説明</th>
     <th scope="col">出演者</th>
    </tr>  
   </thead>
 
   
  </table>
 
 </body>
</html>
